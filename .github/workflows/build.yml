name: Build EDITH MARK 50 ULTRA APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer==1.5.0 python-for-android

      - name: DEFINITIVE FIX - Licenses + sdkmanager
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p $HOME/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea1c5514f83c1059b8ea4b496\n" > $ANDROID_HOME/licenses/android-sdk-license
          cp $ANDROID_HOME/licenses/android-sdk-license $HOME/.android/licenses/ || true
          cp $ANDROID_HOME/licenses/android-sdk-license ~/.buildozer/android/platform/android-sdk/licenses/ || true
          cp $ANDROID_HOME/licenses/android-sdk-license $ANDROID_HOME/licenses/android-sdk-preview-license || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;37.0.0" "build-tools;33.0.2" "platform-tools" "platforms;android-33" || true
          cp -r $ANDROID_HOME/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager || true
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager || true

      - name: Build APK
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EDITH-MARK-50-ULTRA-APK
          path: bin/*.apk
          if-no-files-found: error
